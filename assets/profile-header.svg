<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Pedro Bertoluchi · .NET and applied AI engineer</title>
  <desc id="description">A dark system-inspired banner using the Bertoluchi portfolio palette. It highlights production engineering, .NET 10, secure APIs, real-time systems, and applied AI.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090B" />
      <stop offset="1" stop-color="#18181B" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818CF8" />
      <stop offset="1" stop-color="#60A5FA" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#818CF8" stop-opacity="0.24" />
      <stop offset="1" stop-color="#818CF8" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#3F3F46" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#background)" />
  <rect x="0.5" y="0.5" width="1199" height="319" rx="23.5" fill="none" stroke="#3F3F46" />
  <rect width="1200" height="320" rx="24" fill="url(#grid)" opacity="0.3" />
  <ellipse cx="1015" cy="68" rx="340" ry="260" fill="url(#glow)" />
  <rect x="0" y="0" width="8" height="320" rx="4" fill="url(#accent)" />

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="64" y="66" fill="#818CF8" font-size="16" font-weight="700" letter-spacing="4">PRODUCTION ENGINEERING</text>
    <text x="64" y="137" fill="#FAFAFA" font-size="52" font-weight="700">Pedro Bertoluchi</text>
    <text x="64" y="184" fill="#E6E6E6" font-size="27" font-weight="500">.NET &amp; Applied AI Engineer</text>
    <text x="64" y="230" fill="#A1A1AA" font-size="18">Architecture → APIs → real-time systems → observability → delivery</text>

    <circle cx="72" cy="274" r="6" fill="#22C55E" />
    <text x="90" y="280" fill="#A1A1AA" font-size="15" font-weight="600" letter-spacing="1.6">BUILDING ON .NET 10 LTS</text>
  </g>

  <g transform="translate(864 56)" font-family="Cascadia Code, Consolas, monospace">
    <rect width="272" height="208" rx="18" fill="#18181B" stroke="#3F3F46" />
    <circle cx="28" cy="27" r="4" fill="#818CF8" />
    <circle cx="44" cy="27" r="4" fill="#52525B" />
    <circle cx="60" cy="27" r="4" fill="#52525B" />
    <text x="28" y="66" fill="#8B8B94" font-size="14">runtime</text>
    <text x="28" y="108" fill="#FAFAFA" font-size="34" font-weight="700">net10.0</text>
    <path d="M28 130H244" stroke="#3F3F46" />

    <rect x="28" y="150" width="54" height="28" rx="14" fill="#27272A" stroke="#3F3F46" />
    <text x="55" y="169" fill="#A1A1AA" font-size="11" text-anchor="middle">API</text>
    <rect x="92" y="150" width="86" height="28" rx="14" fill="#27272A" stroke="#3F3F46" />
    <text x="135" y="169" fill="#A1A1AA" font-size="11" text-anchor="middle">REAL-TIME</text>
    <rect x="188" y="150" width="56" height="28" rx="14" fill="#27272A" stroke="#3F3F46" />
    <text x="216" y="169" fill="#A1A1AA" font-size="11" text-anchor="middle">AI</text>
  </g>
</svg>
